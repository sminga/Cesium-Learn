<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="./../../libs/Cesium/Cesium.js"></script> <!-- bulid文件夹下的Cesium.js,是核心功能的js文件 -->
  <link rel="stylesheet" href="./../../../libs/Cesium/Widgets/widgets.css"> <!-- //核心样式 -->
  <style>
    html,body,#cesiumContainer{
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4ZDE2NTBjZi1jNGIyLTRlYmQtOTE5NS1iMGEzMjZkYzY2ZDciLCJpZCI6MzcxODU1LCJpYXQiOjE3NzU2MzYwOTF9.-vafpENPNz2ukkC8Y9Y3iDJdCGnZiPpGJatyZ7mfqYU';
    //创建Cesium Viewer
    const viewer = new Cesium.Viewer('cesiumContainer',{
      // animation: false, //动画控制
      // baseLayerPicker: false, //图层选择控件
      // fullscreenButton: false, //全屏按钮
    });
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(114.41, 34.04, 1000), // 设置相机位置为北京的经纬度坐标和高度
    orientation: { // 设置相机朝向
      heading: Cesium.Math.toRadians(0), // 相机水平方向​朝哪看（绕 Z 轴旋转），单位为弧度
      // 0°→ 朝 北
      // 90°→ 朝 东
      // 180°→ 朝 南
      // 270°→ 朝 西
      pitch: Cesium.Math.toRadians(-30), // 垂直旋转角度，单位为弧度
      roll: 0 // 滚转角度，单位为弧度
    }
  });
  </script>
</head>
<body>

</body>
</html>
