<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium Click to Get Height</title>
  <!-- 请确保以下相对路径在您的项目结构中是正确的 -->
  <script src="./../../libs/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="./../../../libs/Cesium/Widgets/widgets.css">
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <script>
    // 1. 设置 Token 并初始化 Viewer
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4ZDE2NTBjZi1jNGIyLTRlYmQtOTE5NS1iMGEzMjZkYzY2ZDciLCJpZCI6MzcxODU1LCJpYXQiOjE3NzU2MzYwOTF9.-vafpENPNz2ukkC8Y9Y3iDJdCGnZiPpGJatyZ7mfqYU';

    const viewer = new Cesium.Viewer("cesiumContainer", {
     // 初始化时加载世界地形
    });

    // 2. 相机飞行到北京
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(116.435314, 39.960521, 150000.0),
      orientation: {
        heading: Cesium.Math.toRadians(0.0),
        pitch: Cesium.Math.toRadians(-90.0),
        roll: 0.0
      }
    });

    // 3. 设置鼠标点击事件处理器
    var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

    // 4. 绑定左键点击事件 (修复了未绑定和省略号的问题)
    handler.setInputAction(function (movement) {
      // 获取点击位置的笛卡尔坐标
      var cartesian = viewer.camera.pickEllipsoid(movement.position, viewer.scene.globe.ellipsoid);

      // 如果点击到了地球表面
      if (cartesian) {
        // 将笛卡尔坐标转换为弧度制的经纬度
        var cartographic = Cesium.Cartographic.fromCartesian(cartesian);

        // 将弧度转换为角度 (修复了 lon, lat 未定义的问题)
        var lon = Cesium.Math.toDegrees(cartographic.longitude);
        var lat = Cesium.Math.toDegrees(cartographic.latitude);

        console.log('lon: ' + lon.toFixed(6) + "  lat: " + lat.toFixed(6));

        // 5. 获取高程 (修复了 terrainProvider 和 positions 未定义的问题)
        // 注意：positions 必须是 Cartographic 对象的数组
        var positions = [cartographic];
        var terrainProvider = viewer.terrainProvider; // 获取 viewer 当前的地形提供者

        Cesium.sampleTerrainMostDetailed(terrainProvider, positions).then(function (samples) {
          if (samples && samples.length > 0) {
            var height3 = samples[0].height;
            console.log('高程是：' + height3.toFixed(2) + "m");
          }
        });
      } else {
        console.log("未点击到地球表面");
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK); // 正确绑定 LEFT_CLICK 事件

  </script>
</body>

</html>
