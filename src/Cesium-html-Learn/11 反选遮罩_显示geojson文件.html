//<----------------方案一:----------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
//底层渲染：使用 GeoJsonDataSource 优雅地加载并高亮河南省的 18 个区域。
//遮罩生成：利用引入的 Turf.min.js，通过 turf.union() 将这 18 个区域合并为一个完整的多边形，然后再用 Cesium.Entity 绘制反向遮罩。

//libs\GeoJSON\anzhouBorder.json 是geojson内部格式参考文件,网上下的不知道为啥都放在同一行,不方便观看
  axios.get('./../../libs/GeoJSON/周口市.geojson')
      .then((response) => {
        const geojsonData = response.data;

        // ===== 步骤 A：高亮填充 + 边界线（stroke 自动画好外轮廓和地市线）=====
        Cesium.GeoJsonDataSource.load(geojsonData, {
          stroke: Cesium.Color.fromCssColorString('#6dcdeb'),
          fill: Cesium.Color.BLUE.withAlpha(0.6),
          strokeWidth: 2,
          clampToGround: true



        }).then((dataSource) => {
          viewer.dataSources.add(dataSource);
          viewer.flyTo(dataSource, { duration: 3 }); // // 使用 flyTo 方法让相机平滑飞行到边界线实体，持续时间为 3 秒
        });

        // ===== 步骤 B：合并 → 反向遮罩 =====
        const combined = turf.combine(geojsonData);
        const mergedPolygon = combined.features[0];
        if (!mergedPolygon || !mergedPolygon.geometry) {
          console.error('合并失败');
          return;
        }

        const geom = mergedPolygon.geometry;
        const outerRings = [];
        if (geom.type === 'MultiPolygon') {
          geom.coordinates.forEach((polygon) => outerRings.push(polygon[0])); // 只取外环
        } else if (geom.type === 'Polygon') {
          outerRings.push(geom.coordinates[0]);
        }

        // 每个外环单独转成一个 hole（绝不能合并成一个数组！）
        const holes = outerRings.map((ring) => {
          const flat = [];
          ring.forEach((pt) => flat.push(pt[0], pt[1]));
          return { positions: Cesium.Cartesian3.fromDegreesArray(flat) };
        });
//<---------------显示内部的市区等小块,注释掉则不显示--------------------------------------------------------------------------------------------------------------------->
        // ===== 步骤 A+：补回"贴地边界线"（地市分界线 + 省外轮廓）=====

        // 小工具：把一个 geometry 的所有坐标环逐个回调，兼容 Polygon 与 MultiPolygon
        const eachRing = (geom, cb) => {
          if (geom.type === 'Polygon') {
            geom.coordinates.forEach(cb);                          // Polygon 结构：coordinates = [ 环, 环... ]
          } else if (geom.type === 'MultiPolygon') {
            geom.coordinates.forEach((poly) => poly.forEach(cb));  // MultiPolygon 结构：coordinates = [ [环..], [环..] ]
          }
        };

        // 遍历 18 个地市 feature，把每个地市的每个环画成一条【独立】的贴地折线
        geojsonData.features.forEach((feature) => {
          eachRing(feature.geometry, (ring) => {                   // ring = [ [lng,lat], [lng,lat], ... ] 一个闭合环
            const flat = [];                                       // 准备一维经纬度数组
            ring.forEach((pt) => flat.push(pt[0], pt[1]));         // 展平：[lng1,lat1,lng2,lat2,...]，供 fromDegreesArray 使用
            viewer.entities.add({                                  // 每个环 = 一个独立 entity（= 一条独立线 → 不会串出斜线）
              polyline: {
                positions: Cesium.Cartesian3.fromDegreesArray(flat),          // 这个环的坐标，转成笛卡尔点串
                width: 2,                                                     // 线宽 2 像素（贴地折线的 width 是有效的，不像贴地面的 strokeWidth 会被吞）
                material: Cesium.Color.fromCssColorString('#6dcdeb'),         // 青色描边，和你想要的外轮廓同色
                clampToGround: true                                           // 贴地，跟蓝块、黑遮罩一起趴在地表，高度一致不打架
              }
            });
          });
        });





//<------------------------------------------------------------------------------------------------------------------------------------>

        //添加遮罩
        viewer.entities.add({
          id: 'maskArea',
          polygon: {
            hierarchy: {
              positions: Cesium.Cartesian3.fromDegreesArray([100, 20, 100, 45, 125, 45, 125, 20]),
              holes: holes
            },
            material: Cesium.Color.BLACK.withAlpha(0.6),
            classificationType: Cesium.ClassificationType.BOTH
          }
        });

      
      })
      .catch((error) => {
        console.error('Axios 请求失败:', error);
      });
