<!-- 
 | 方式                     | 代码                               | 优点                  | 缺点                   | 适用场景 |
| :---                     | :---                               | :---                  | :---                   | :--- |
| CLAMP_TO_GROUND          | `heightReference: CLAMP_TO_GROUND` | 简单、自动、GPU加速    | 大量实体时可能有性能开销 | 少量标注、POI点 |
| getHeight                | `globe.getHeight(cartographic)`    | 同步、可控            | 依赖地形已加载、精度受限 | 用户交互后的单点查询 |
| sampleHeightMostDetailed | `scene.sampleHeightMostDetailed()` | 异步、高精度、自动等待 | 返回Promise，需异步处理 | 批量点位、精确测量 | -->



<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>矢量-点</title>
  <link rel="stylesheet" href="./../../../../libs/cesium/Widgets/widgets.css">
  <script type="text/javascript" src="./../../../../libs/cesium/Cesium.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">


  <button onclick="add()"> 添加自动计算贴地，需要等到地形加载完，且在大范围下 </button>
  <!--  onclick="add()" 传统 DOM 事件绑定，调用下方定义的 add 函数 -->


  <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
  <script type="text/javascript">

    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4ZDE2NTBjZi1jNGIyLTRlYmQtOTE5NS1iMGEzMjZkYzY2ZDciLCJpZCI6MzcxODU1LCJpYXQiOjE3NzU2MzYwOTF9.-vafpENPNz2ukkC8Y9Y3iDJdCGnZiPpGJatyZ7mfqYU';

    const viewer = new Cesium.Viewer('map', {
      // 去掉对话框警告
      infoBox: false,
      // 是否显示查询按钮
      geocoder: true,
      // 是否显示home按钮
      homeButton: true,
      // 控制查看器的显示模式（3D、2.5D、2D是否显示）
      sceneModePicker: true,
      // 是否显示图层选择
      baseLayerPicker: false,
      // 是否显示帮助按钮
      navigationHelpButton: false,
      // 是否显示播放动画、计时
      animation: false,
      // 是否显示时间轴
      timeline: false,
      // 是否显示全屏按钮
      fullscreenButton: false,

    });
    //隐藏 Cesium 的版权信息水印。
    viewer.cesiumWidget.creditContainer.style.display = "none";
    // 开启帧率
    viewer.scene.debugShowFramesPerSecond = true;

    // 天地图影像底图（卫星图）
    const tiandituImgLayer = new Cesium.WebMapTileServiceImageryProvider({
      //url: "https://t0.tianditu.gov.cn/img_w/wmts?tk=你的Key", //修改成自己的token
      //url: 'https://t{s}.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=你的Key'
      url: "https://t0.tianditu.gov.cn/img_w/wmts?tk=8c2b8afdfd321dbe7a98d7f78680ab52", //修改成自己的token
      layer: "img",
      style: "default",
      tileMatrixSetID: "w",
      format: "tiles",
      maximumLevel: 18
    });
    viewer.imageryLayers.addImageryProvider(tiandituImgLayer);


    viewer.scene.setTerrain(
      new Cesium.Terrain(
        Cesium.CesiumTerrainProvider.fromIonAssetId(1),
      ),
    );

    // 深度监测
    // depthTestAgainstTerrain	当设为 true 时，如果实体在地形下方（如地下），会被地形遮挡而不可见
    //默认值 false	默认情况下，即使实体在地形以下也会渲染出来（穿透地形可见）
    viewer.scene.globe.depthTestAgainstTerrain = true;

    // http://cesium.xin/cesium/cn/Documentation1.72/LabelGraphics.html#.ConstructorOptions

// ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// 1.贴地点 + 标签（CLAMP_TO_GROUND 方式）
 var hello = viewer.entities.add({
    name: '贴地',
    position: Cesium.Cartesian3.fromDegrees(-75.166493, 39.9060534), //⭐ 关键：不设置高度，默认就是0
    point: {
      pixelSize: 5,                              // 点的像素大小
      color: Cesium.Color.RED,                   // 填充颜色
      outlineColor: Cesium.Color.WHITE,          // 边框颜色
      outlineWidth: 2,                           // 边框宽度
      verticalOrigin: Cesium.VerticalOrigin.TOP, // 垂直原点：TOP=点在坐标位置上方
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, // ⭐ 关键：贴地
      disableDepthTestDistance: Number.POSITIVE_INFINITY, // ⭐ 禁用深度测试
    },
    label: {
      text: '贴地',
      font: '14pt monospace',
      outlineWidth: 2,
      verticalOrigin: Cesium.VerticalOrigin.TOP,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, // ⭐ 标签也贴地
      disableDepthTestDistance: Number.POSITIVE_INFINITY,
      showBackground: true,                      // 显示标签背景色
      backgroundColor: Cesium.Color.WHITE        // 背景颜色
    }
  });

// ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// 2. 不贴地点 + 标签（NONE 方式）
   var world = viewer.entities.add({
      name: '不贴地',
      position: Cesium.Cartesian3.fromDegrees(-95.166493, 39.9060534, 2000), // ⭐ 第三个参数=海拔2000米
      point: {
        pixelSize: 5,
        color: Cesium.Color.RED,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2,
        // ❌ 没有 heightReference → 默认 NONE，使用绝对高度
      },
      label: {
        text: '不贴地',
        font: '14pt monospace',
        outlineWidth: 2,
        // ❌ 没有 disableDepthTestDistance → 可能被地形遮挡
      }
    });

// ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------
//3. 贴地 + 标签（RELATIVE_TO_GROUND 方式）
    // 自动计算贴地，需要等地形加载完方可

 function add() {
    // 1️⃣ 相机飞行到目标位置
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(-115.166493, 39.9060534, 15000.0),
      duration: 3,
      orientation: {
        heading: Cesium.Math.toRadians(90.0),  // 朝向正东
        pitch: Cesium.Math.toRadians(-90),     // 垂直俯视
        roll: 0.0                              // 无翻滚
      },

      complete: () => {
        // 2️⃣ 飞行完成后，延迟1秒等地形瓦片加载
        setTimeout(() => {
          // 3️⃣ 创建 Cartographic 对象（不含高度）
          var cartographic = Cesium.Cartographic.fromDegrees(-115.166493, 39.9060534, 10);
          var posi = new Cesium.Cartographic(cartographic.longitude, cartographic.latitude);

          // 4️⃣ ⭐ 从已加载的地形瓦片中采样高度
          var height = viewer.scene.globe.getHeight(posi);
          console.log(height); // 如果地形未加载，返回 undefined

          // 5️⃣ 用查到的真实地形高度 + 0.1m 偏移来放置实体
          var haha = viewer.entities.add({
            name: '自动计算贴地',
            position: Cesium.Cartesian3.fromDegrees(-115.166493, 39.9060534, height + 0.1),
            point: { /* ... */ },
            label: { /* ... */ }
          });
        }, 1000); // ⚠️ 硬编码延迟，不够可靠
      }
    });
  }




    // 日后动态修改值和属性
    hello.label.text = '我是贴地的'
    hello.label.fillColor = Cesium.Color.RED
    // hello.position =  Cesium.Cartesian3.fromDegrees(-100, 39.9060534)

  </script>
</body>

</html>
