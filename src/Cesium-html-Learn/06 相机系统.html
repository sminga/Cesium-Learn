<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="../lib/Cesium/Cesium.js"></script> <!-- bulid文件夹下的Cesium.js,是核心功能的js文件 -->
  <link rel="stylesheet" href="../lib/Cesium/Widgets/widgets.css"> <!-- //核心样式 -->
  <style>
    html,body,#cesiumContainer{
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4ZDE2NTBjZi1jNGIyLTRlYmQtOTE5NS1iMGEzMjZkYzY2ZDciLCJpZCI6MzcxODU1LCJpYXQiOjE3NzU2MzYwOTF9.-vafpENPNz2ukkC8Y9Y3iDJdCGnZiPpGJatyZ7mfqYU';
    //创建Cesium Viewer
    const viewer = new Cesium.Viewer('cesiumContainer',);
    
   //setview 方法是Cesium中用于设置相机视图的方法，可以通过viewer.camera.setView()来调用
   //setview方法接受一个包含相机位置、方向和视角等参数的对象，可以通过设置这些参数来控制相机的视图，如位置、朝向、倾斜角度等
   //setview方法可以用于在场景中快速切换到特定位置或  视角，方便用户查看场景中的不同部分
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(116.407396, 39.904200, 1000), // 设置相机位置为北京的经纬度坐标和高度
      orientation: { // 设置相机朝向
        heading: Cesium.Math.toRadians(0), // 相机水平方向​朝哪看（绕 Z 轴旋转），单位为弧度
        // 0°→ 朝 北
        // 90°→ 朝 东
        // 180°→ 朝 南
        // 270°→ 朝 西
        pitch: Cesium.Math.toRadians(-30), // 垂直旋转角度，单位为弧度
        roll: 0 // 滚转角度，单位为弧度
      }
    });



    // //flyto方法是Cesium中用于平滑飞行到特定位置的方法，可以通过viewer.camera.flyTo()来调用
    // //flyto方法接受一个包含飞行目标位置、飞行时间和飞行曲线等参数的对象，可以通过设置这些参数来控制飞行的目标位置、飞行时间和飞行曲线等
    // //flyto方法可以用于在场景中平滑飞行到特定位置，提供更好的用户体验，适用于需要在场景中快速切换到不同位置的情况
    viewer.camera.flyTo({ // 平滑飞行到北京的位置 和视角  
      destination: Cesium.Cartesian3.fromDegrees(116.407396, 39.904200, 10), // 设置飞行目标位置为北京的经纬度坐标和高度
      orientation: { // 设置飞行目标的相机朝向
        heading: Cesium.Math.toRadians(0), // 水平旋转角度，单位为弧度
        pitch: Cesium.Math.toRadians(-30), // 垂直旋转角度，单位为弧度
        roll: 0 // 滚转角度，单位为弧度
      },
      duration: 3, // 设置飞行时间为3秒
      easingFunction: Cesium.EasingFunction.LINEAR_NONE // 设置飞行曲线为线性曲线
    });



    // //lookAt方法是Cesium中用于让相机朝向特定目标的方法，可以通过viewer.camera.lookAt()来调用
    // //lookAt方法接受一个包含目标位置和相机位置等参数的对象，可以通过设置这些参数来控制相机朝向特定目标，如位置、朝向等
    // //lookAt方法可以用于在场景中让相机朝向特定目标，提供更好的用户体验，适用于需要在场景中快速切换到不同目标的情况
    const center = Cesium.Cartesian3.fromDegrees(116.407396, 39.904200, 0); // 设置目标位置为北京的经纬度坐标和高度
    
    const offset = new Cesium.Cartesian3(0, 0, 1000); // 设置相机位置相对于目标位置的偏移量
    const heading = Cesium.Math.toRadians(0); // 相机水平方向​朝哪看（绕 Z 轴旋转）
      // 0°→ 朝 北
      // 90°→ 朝 东
      // 180°→ 朝 南
      // 270°→ 朝 西
    const pitch = Cesium.Math.toRadians(-30); // 设置相机朝向的垂直旋转角度，单位为弧度
    const roll = 0; // 设置相机朝向的滚转角度，单位为弧度
    viewer.camera.lookAt(center, offset, heading, pitch, roll); // 让相机朝向北京的位置和视角，提供更好的用户体验   


  //viewBoundingSphere方法是Cesium中用于让相机适应特定范围的方法，可以通过viewer.camera.viewBoundingSphere()来调用
  // //viewBoundingSphere方法接受一个包含范围中心和范围半径等参数的对象，可以通过设置这些参数来控制相机适应特定范围，如位置、朝向等
  // //viewBoundingSphere方法可以用于在场景中让相机适应特定  范围，提供更好的用户体验，适用于需要在场景中快速切换到不同范围的情况

  let position = Cesium.Cartesian3.fromDegrees(114.40, 34.07, 300); // 设置范围中心位置为北京的经纬度坐标和高度
  //错误,下一行是更正：let orientation = Cesium.Transforms.headingPitchRollQuaternion(position, Cesium.Math.toRadians(0), Cesium.Math.toRadians(-30), 0); // 设置范围的朝向
  //错误分析，现在选择必须要用HeadingPitchRoll类来设置相机朝向（大概，因为还需再查一下官方文档）
  let orientation = Cesium.Transforms.headingPitchRollQuaternion(position, new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(0), Cesium.Math.toRadians(30), 0)); // 设置范围的朝向
  let entity = viewer.entities.add({ // 创建一个实体(entity)并添加到查看器(viewer)中
    name: 'Cesium官方飞机模型', // 实体名称设置为"北京"
    position: position, // 实体位置设置为北京的位置), // 使用经纬度坐标设置实体位置(北京的大致坐标)
    orientation: orientation, // 实体朝向设置为范围的朝向
    model: { // 模型属性设置
      uri: '../../Cesium-1.137/Apps/SampleData/models/CesiumAir/Cesium_Air.glb', // 模型文件的URI路径
      minimumPixelSize: 200, // 模型的最小像素大小，确保在远距离时仍然可见
      maximumScale: 200 ,// 模型的最大缩放比例，防止在近距离时过大
      show: true // 模型显示设置为true，确保模型在场景中可见  
    }
  });
  
  // // viewer.camera.viewBoundingSphere(new Cesium.BoundingSphere(position, 1000), new Cesium.HeadingPitchRange(0, 0, 0)); // 让相机适应以北京为中心，半径为1000的范围，并设置朝向，提供更好的用户体验
  // viewer.flyTo(entity, { // 让相机飞向实体
  //   duration: 3, // 设置飞行时间为3秒
  //   easingFunction: Cesium.EasingFunction.LINEAR_NONE // 设置飞行曲线为线性曲线
  // });
  
   </script>



</body>
</html>
