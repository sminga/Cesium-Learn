<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium 获取本地位置</title>

 引入 Cesium
  <!-- <link rel="stylesheet" href="./../../libs/cesium/Widgets/widgets.css">
  <script type="text/javascript" src="./../../libs/cesium/Cesium.js"></script>  -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; }

    /* 定位按钮样式 */
    .locate-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 999;
      padding: 10px 20px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: background 0.3s;
    }
    .locate-btn:hover { background: #45a049; }
    .locate-btn:disabled { background: #999; cursor: not-allowed; }

    /* 加载提示 */
    .loading-toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 9999;
      display: none;
    }

    /* 位置信息面板 */
    .info-panel {
      position: absolute;
      bottom: 30px;
      left: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.8;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Cesium 容器 -->
  <div id="cesiumContainer"></div>

  <!-- UI 控件 -->
  <button class="locate-btn" id="locateBtn">📍 获取我的位置</button>
  <div class="loading-toast" id="loadingToast">⏳ 正在获取位置...</div>
  <div class="info-panel" id="infoPanel"></div>

  <script>
 


    const viewer = new Cesium.Viewer('cesiumContainer', {
   
      baseLayerPicker: false,
      geocoder: false,           
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: false,
      homeButton: false,
    });

     const tiandituImgLayer = new Cesium.WebMapTileServiceImageryProvider({
        //url: "https://t0.tianditu.gov.cn/img_w/wmts?tk=你的Key", //修改成自己的token
        //url: 'https://t{s}.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=你的Key'
        url: "https://t0.tianditu.gov.cn/img_w/wmts?tk=8c2b8afdfd321dbe7a98d7f78680ab52", //修改成自己的token
        layer: "img",
        style: "default",
        tileMatrixSetID: "w",
        format: "tiles",
        maximumLevel: 18
      });
      viewer.imageryLayers.addImageryProvider(tiandituImgLayer);

    // 默认视角：中国上空
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(104.0, 35.0, 8000000),
    });


    function setLoading(show) {
      const toast = document.getElementById('loadingToast');
      const btn = document.getElementById('locateBtn');
      toast.style.display = show ? 'block' : 'none';
      btn.disabled = show;
      btn.textContent = show ? '⏳ 定位中...' : '📍 获取我的位置';
    }

    function showInfo(longitude, latitude, altitude, accuracy) {
      const panel = document.getElementById('infoPanel');
      panel.style.display = 'block';
      panel.innerHTML = `
        <strong>📍 当前位置</strong><br/>
        经度: ${longitude.toFixed(6)}°<br/>
        纬度: ${latitude.toFixed(6)}°<br/>
        海拔: ${(altitude || 0).toFixed(1)} m<br/>
        精度: ±${accuracy.toFixed(0)} m
      `;
    }

    function updateMarker(viewer, longitude, latitude) {
      const markerId = 'currentUserMarker';

      if (viewer.entities.getById(markerId)) {
        // 已存在则更新位置
        const entity = viewer.entities.getById(markerId);
        entity.position = Cesium.Cartesian3.fromDegrees(longitude, latitude);
      } else {
        // 不存在则创建
        viewer.entities.add({
          id: markerId,
          name: '我的位置',
          position: Cesium.Cartesian3.fromDegrees(longitude, latitude),
          point: {
            pixelSize: 18,
            color: Cesium.Color.RED,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 3,
          },
          label: {
            text: '📍 我的位置',
            font: '14px sans-serif',
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -20),
          },
        });
      }
    }

  
    function flyToCurrentLocation() {
      // 检查浏览器支持
      if (!navigator.geolocation) {
        alert('❌ 您的浏览器不支持地理定位功能。\n请使用 Chrome / Edge / Firefox 等现代浏览器。');
        return;
      }

      setLoading(true);

      navigator.geolocation.getCurrentPosition(
        // ✅ 成功回调
        (position) => {
          const { longitude, latitude, altitude, accuracy } = position.coords;

          console.log('定位成功:', { longitude, latitude, altitude, accuracy });

          // 添加地图标记
          updateMarker(viewer, longitude, latitude);

          // 飞行到目标位置
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(longitude, latitude, 3000),
            orientation: {
              heading: Cesium.Math.toRadians(0),
              pitch: Cesium.Math.toRadians(-60),
              roll: 0,
            },
            duration: 2,
            complete: () => {
              console.log('✅ 已到达目标位置');
            },
            cancel: () => {
              console.log('⚠️ 飞行动画被取消');
            },
          });

          // 显示信息面板
          showInfo(longitude, latitude, altitude, accuracy);
          setLoading(false);
        },

        // ❌ 失败回调
        (error) => {
          setLoading(false);
          const errorMessages = {
            [error.PERMISSION_DENIED]: '❌ 用户拒绝了定位请求。\n请在浏览器地址栏左侧允许定位权限后重试。',
            [error.POSITION_UNAVAILABLE]: '❌ 无法获取位置信息。\n请检查 GPS/网络是否正常。',
            [error.TIMEOUT]: '❌ 获取位置超时（10秒）。\n请到开阔地带重试，或检查网络。',
          };
          alert(errorMessages[error.code] || `❌ 未知错误 (${error.code}): ${error.message}`);
        },

    
        {
          enableHighAccuracy: true,   // 启用高精度 GPS
          timeout: 10000,             // 超时 10 秒
          maximumAge: 60000,          // 缓存 60 秒内的结果
        }
      );
    }


    // 3. 绑定事件

    document.getElementById('locateBtn').addEventListener('click', flyToCurrentLocation);
  </script>
</body>
</html>
