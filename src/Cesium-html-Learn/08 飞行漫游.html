<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="./../../libs/cesium/Widgets/widgets.css">
<script type="text/javascript" src="./../../libs/cesium/Cesium.js"></script>
<script src="./../../libs/JS/latlng.js"></script>
<script src="./../../libs/JS/Roaming.js"></script>

  <style>
    .cotrols {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 10000;
    }
  </style>
  
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
  <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
  <div class="cotrols">
    <button onclick="cameraRoaming()">开始相机漫游</button>
    <button onclick="PauseOrContinue(false)">暂停</button>
    <button onclick="PauseOrContinue(true)">继续</button>
    <button onclick="EndRoaming()">取消</button>
  </div>

  <script type="text/javascript">

    const viewer = new Cesium.Viewer('map', {
      imageryProvider: false,
      baseLayerPicker: false,
    });

  const tiandituImgLayer = new Cesium.WebMapTileServiceImageryProvider({
    //url: "https://t0.tianditu.gov.cn/img_w/wmts?tk=你的Key", //修改成自己的token
    //url: 'https://t{s}.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=你的Key'
    url: "https://t0.tianditu.gov.cn/img_w/wmts?tk=8c2b8afdfd321dbe7a98d7f78680ab52", //修改成自己的token
    layer: "img",
    style: "default",
    tileMatrixSetID: "w",
    format: "tiles",
    maximumLevel: 18
  });
  viewer.imageryLayers.addImageryProvider(tiandituImgLayer);

    // 开启帧率
    viewer.scene.debugShowFramesPerSecond = true;

    
    var roaming = new Roaming(viewer, { time: 3 }); //3秒飞完
    /*
    const roaming = new Roaming(viewer, {
    time: 360,        // 漫游总时长（秒），默认 360
    multiplier: 1     // 播放速度倍率，默认 1
});
    */

    function cameraRoaming() {
      roaming.cameraRoaming( //路径点
        [
          Cesium.Cartesian3.fromDegrees(114.35231209, 30.53542614, 1000), 
          Cesium.Cartesian3.fromDegrees(114.40782845, 30.51011682, 100)
        ]
      )
    }
    function PauseOrContinue(params) {
      roaming.PauseOrContinue(params)
    }
    function EndRoaming() {
      roaming.EndRoaming()
    }
  </script>
</body>

</html>
