<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium 学习案例展示</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      margin: 10px 0;
    }

    a {
      text-decoration: none;
      color: #007bff;
      font-size: 16px;
      display: block;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

    a:hover {
      background-color: #f0f8ff;
      color: #0056b3;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌍 Cesium 学习案例库</h1>
    <p>点击下方链接查看具体效果：</p>
    <ul>
      <!-- 注意：这里的路径要对应你 src 文件夹里的实际文件名 -->
      <!-- 注意：这里的路径要对应你 public 文件夹里的实际文件名，但不要写 public 前缀。 -->
      <!-- 例如：01_03.html 对应 public/01_03.html   -->
      <!-- 代码中点击不会正确跳转，但服务器能正常读取  -->
      <li><a href="/01_03.html">01 天地图快捷按钮切换</a></li>
      <li><a href="/05_01.html">02 点击获得经纬度</a></li>
      <li><a href="/02AI.html">03 AI 本地地形加载</a></li>
      <li><a href="/mao_fused_3d_observation_compact_1h_uvfixed_report.html">04 毛铂函的本地数据可视化展示</a></li>


      <!-- 你可以继续往下添加... -->
    </ul>
  </div>

  <script>
    document.querySelectorAll('a[href$=".html"]').forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault(); // 阻止框架的默认路由行为
        window.location.href = this.href; // 强制浏览器进行整页跳转
      });
    });
  </script>
</body>

</html>


<!-- 使用说明 -->
<!-- 所有文件都要放在public中，但是引用时不要写 public 前缀例如：01_03.html 对应 public/01_03.html -->
